[project]
name = "sound-analyzer"
version = "0.1.0"
description = "Record speech, transcribe it to IPA, and match it against a word list"
readme = "README.md"
authors = [
    { name = "Aleksa Dejanovic", email = "dejanovicaleksa234@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "allosaurus>=1.0.2",
    "numba<0.60",
    "numpy==1.26.4",
    "panphon==0.21.2",
    "resampy==0.4.3",
    "setuptools<81",
    "sounddevice>=0.5.5",
]

[dependency-groups]
dev = [
    "mypy>=1.14,<2",
    "ruff>=0.12,<1",
]

[project.scripts]
sound-analyzer = "sound_analyzer.cli:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "RUF001", # IPA intentionally contains visually similar Unicode symbols.
    "UP007",  # Keep typing syntax importable on the supported Python 3.9.
    "UP045",
]

[tool.mypy]
python_version = "3.9"
strict = true
files = ["src", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["allosaurus.*", "panphon.*", "sounddevice.*"]
ignore_missing_imports = true
