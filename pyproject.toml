[project]
name = "phonomatch"
version = "0.1.0"
description = "Record speech, transcribe it to IPA, and match it against a word list"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["audio", "ctc", "ipa", "phonetics", "speech-recognition", "wav2vec2"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
authors = [
    { name = "Aleksa Dejanovic" }
]
requires-python = ">=3.10"
dependencies = [
    "panphon==0.22.2",
]

[project.optional-dependencies]
recognition = [
    "numpy>=1.26,<3",
    "huggingface-hub>=0.30,<1",
    "onnxruntime>=1.20,<1.24; python_version < '3.11'",
    "onnxruntime>=1.20,<1.30; python_version >= '3.11'",
    "scipy>=1.10,<2",
]
microphone = [
    "phonomatch[recognition]",
    "sounddevice>=0.5.5",
]
all = [
    "phonomatch[microphone]",
]

[project.urls]
Homepage = "https://github.com/aleksa-dejanovic/phonomatch"
Repository = "https://github.com/aleksa-dejanovic/phonomatch"
Issues = "https://github.com/aleksa-dejanovic/phonomatch/issues"

[dependency-groups]
dev = [
    "coverage[toml]>=7.6,<8",
    "mypy>=1.14,<2",
    "numpy>=1.26,<3",
    "huggingface-hub>=0.30,<1",
    "onnxruntime>=1.20,<1.24; python_version < '3.11'",
    "onnxruntime>=1.20,<1.30; python_version >= '3.11'",
    "ruff>=0.12,<1",
    "scipy>=1.10,<2",
    "sounddevice>=0.5.5",
]

[project.scripts]
phonomatch = "phonomatch.interfaces.cli:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-exclude = ["pyproject.toml.orig"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "RUF001", # IPA intentionally contains visually similar Unicode symbols.
    "UP045",
]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
warn_unreachable = true

[tool.coverage.run]
branch = true
source = ["src/phonomatch"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.coverage.html]
directory = "htmlcov"

[[tool.mypy.overrides]]
module = ["panphon.*", "scipy.*", "sounddevice.*", "onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true
