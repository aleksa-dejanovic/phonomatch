[project]
name = "phonematch"
version = "0.1.0"
description = "Record speech, transcribe it to IPA, and match it against a word list"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["audio", "ctc", "ipa", "phonetics", "speech-recognition", "wav2vec2"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
authors = [
    { name = "Aleksa Dejanovic", email = "dejanovicaleksa234@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "numpy==1.26.4",
    "panphon==0.21.2",
    "scipy>=1.10,<1.14",
    "setuptools<81",
    "sounddevice>=0.5.5",
    "torch>=2.0,<3",
    "transformers>=4.45,<5",
]

[project.urls]
Homepage = "https://github.com/aleksa-dejanovic/phonematch"
Repository = "https://github.com/aleksa-dejanovic/phonematch"
Issues = "https://github.com/aleksa-dejanovic/phonematch/issues"

[dependency-groups]
dev = [
    "mypy>=1.14,<2",
    "ruff>=0.12,<1",
]

[project.scripts]
phonematch = "phonematch.interfaces.cli:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-exclude = ["pyproject.toml.orig"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "RUF001", # IPA intentionally contains visually similar Unicode symbols.
    "UP007",  # Keep typing syntax importable on the supported Python 3.9.
    "UP045",
]

[tool.mypy]
python_version = "3.9"
strict = true
files = ["src", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["panphon.*", "scipy.*", "sounddevice.*", "transformers", "transformers.*"]
ignore_missing_imports = true
