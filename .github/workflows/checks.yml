name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: false

      - name: Install locked dependencies
        run: uv sync --locked --all-extras --dev --python ${{ matrix.python-version }}

      - name: Check formatting
        run: uv run --python ${{ matrix.python-version }} ruff format --check .

      - name: Run lint
        run: uv run --python ${{ matrix.python-version }} ruff check .

      - name: Run strict type checks
        run: uv run --python ${{ matrix.python-version }} python -m mypy --python-version ${{ matrix.python-version }}

      - name: Run unit tests
        run: uv run --python ${{ matrix.python-version }} coverage run -m unittest discover -s tests -v

  package:
    name: Package (Ubuntu, Python 3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: false

      - name: Install locked dependencies
        run: uv sync --locked --all-extras --dev --python 3.10

      - name: Run repository quality and package checks
        run: bash scripts/check.sh
